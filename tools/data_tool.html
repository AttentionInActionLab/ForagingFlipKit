<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FFK DataTool</title>

<style>
body { font-family: Arial; margin:20px; background:#f4f4f4; }

.panel {
  border:1px solid #ccc;
  border-radius:6px;
  padding:15px;
  background:white;
  margin-bottom:15px;
}

button {
  margin:5px 5px 5px 0;
  font-size: 14px;
  cursor:pointer;
}

table {
  width:100%;
  border-collapse: collapse;
  margin-top:10px;
}

th, td {
  border:1px solid #ccc;
  padding:6px;
}

th { background:#eee; }

tr.selected { background:#d0e7ff; }

.controls { 
  margin-top:10px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
}

.title-container {
  display:flex;
  align-items:center;
  gap:12px;
}

.title-image {
  height:80px;
  border-radius:12px;
}

.checkbox-bar {
  margin-top:10px;
  font-size:14px;
  display:flex;
  gap:20px;
}
</style>
</head>

<body>

<div class="title-container">
  <img src="../misc/attention-in-action-lab.png" style="width: 100px; height: 100px; border-radius: 12px;">
  <h1>ForagingFlipKit - DataTool</h1>
</div>

<br/>

<div class="panel">
  <table id="fileTable">
    <thead>
      <tr><th>#</th><th>Filename</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="controls">
    <input type="file" id="fileInput" multiple accept=".json,*.*" style="display:none">
    <button onclick="document.getElementById('fileInput').click()">
      ➕ Add .json files
    </button>

    <button onclick="moveUp()">⬆️</button>
    <button onclick="moveDown()">⬇️</button>
    <button onclick="removeSelected()">❌</button>
  </div>
</div>


 <div class="checkbox-bar">
    <label>
      <input type="checkbox" id="legacyMode">
      Legacy Mode
    </label>

    <label>
      <input type="checkbox" id="addComputables" checked>
      Add computables
    </label>
  </div>

  <hr>
  <label>
      <input type="checkbox" id="gather">
      Gather info from surrounding jspsych trials<br>
  </label>

  <label>
    Trial context range:
    <input id="trialRange" value="[0,1]" style="width:80px">
  </label>
  <label>
    Trial keys to copy:
    <input id="trialKeys" value="rt,correct" style="width:200px">
  </label>

</div>
<div class="panel">
  <button onclick="createCSV()">💾 Create long dataframe .csv</button>
</div>
<script>
let fileList = [];
let selectedIndex = null;

// -------- FILE HANDLING --------
document.getElementById("fileInput").addEventListener("change", e => {
  const files = Array.from(e.target.files);
  files.forEach(f => fileList.push(f));
  renderTable();
  e.target.value = "";
});

function renderTable(){
  const tbody = document.querySelector("#fileTable tbody");
  tbody.innerHTML = "";
  fileList.forEach((file,i)=>{
    const tr = document.createElement("tr");
    if(i === selectedIndex) tr.classList.add("selected");
    tr.innerHTML = `<td>${i+1}</td><td>${file.name}</td>`;
    tr.onclick = ()=>{ selectedIndex=i; renderTable(); };
    tbody.appendChild(tr);
  });
}

function removeSelected(){
  if(selectedIndex===null) return;
  fileList.splice(selectedIndex,1);
  selectedIndex=null;
  renderTable();
}

function moveUp(){
  if(selectedIndex===null||selectedIndex===0) return;
  [fileList[selectedIndex-1],fileList[selectedIndex]] =
  [fileList[selectedIndex],fileList[selectedIndex-1]];
  selectedIndex--;
  renderTable();
}

function moveDown(){
  if(selectedIndex===null||selectedIndex===fileList.length-1) return;
  [fileList[selectedIndex+1],fileList[selectedIndex]] =
  [fileList[selectedIndex],fileList[selectedIndex+1]];
  selectedIndex++;
  renderTable();
}

function extractSurveyData(data, participantID){

    const row = {
        Participant_ID: participantID
    };


    // Find main task boundaries
    const patchIndices = data
        .map((trial, i) =>
            trial.trial_type === "foraging-patch" ? i : -1
        )
        .filter(i => i >= 0);


    // No foraging task found
    if(patchIndices.length === 0){
        return row;
    }


    const firstPatch = patchIndices[0];
    const lastPatch = patchIndices[patchIndices.length - 1];


    data.forEach((trial, trialIndex)=>{


        // Only surveys before or after main task
        if(
            trialIndex >= firstPatch &&
            trialIndex <= lastPatch
        ){
            return;
        }


        // Only jsPsych 6 survey plugins
        if(
            !trial.trial_type ||
            !trial.trial_type.startsWith("survey-")
        ){
            return;
        }


        // jsPsych 6 stores responses as JSON string
        if(!trial.responses){
            return;
        }


        let responses;

        try{

            responses = JSON.parse(trial.responses);

        }catch(e){

            return;

        }


        Object.entries(responses).forEach(([key,value])=>{

            row[`Trial_${trialIndex}_${key}`] = value;

        });


    });


    return row;

}

// -------- MAIN PROCESSING --------
async function createCSV(){

  

  let rows = [];
  let surveyRows = [];
  
  function parseTrialRange(value){

  try {
    const range = JSON.parse(value);

    if(
      Array.isArray(range) &&
      range.length === 2 &&
      Number.isInteger(range[0]) &&
      Number.isInteger(range[1])
    ){
      return range;
    }

  } catch(e){}

  return [0,0];
}


function parseTrialKeys(value){

  return value
    .split(",")
    .map(k => k.trim())
    .filter(k => k.length>0);

}


function getSurroundingTrialData(data, patchIndex, range, keys){

  const output = {};

  const start = range[0];
  const end = range[1];


  for(let offset=start; offset<=end; offset++){


    // offset 0 = current patch, ignore
    if(offset===0) continue;


    const trialIndex = patchIndex + offset;


    if(
      trialIndex < 0 ||
      trialIndex >= data.length
    ){
      continue;
    }


    const trial = data[trialIndex];


    let prefix;


    if(offset < 0){

      prefix = "B" + Math.abs(offset);

    } else {

      prefix = "A" + offset;

    }


    keys.forEach(key=>{

      output[`S_Trial_${prefix}_${key}`] =
        trial[key] ?? "";

    });

  }


  return output;

}
  
  if(fileList.length===0){
    alert("No files selected.");
    return;
  }
  
  
  const gather =
  document.getElementById("gather").checked;

  const legacyMode =
  document.getElementById("legacyMode").checked;

  const addComputablesFlag =
  document.getElementById("addComputables").checked;


  const trialRange =
  parseTrialRange(
    document.getElementById("trialRange").value
  );


  const trialKeys =
  parseTrialKeys(
    document.getElementById("trialKeys").value
  );


  for(let fileIndex=0; fileIndex<fileList.length; fileIndex++){
    const file = fileList[fileIndex];
    const text = await file.text();
    const data = parseJSONFlexible(text);
    const participantID = fileIndex + 1;
    
    surveyRows.push(
      extractSurveyData(
        data,
        participantID
      )
    );

    const patches = data //.filter(d => d.trial_type === "foraging-patch");


    
    
    // -------- compute min trial index for this participant --------
    let minTrialIndex = Infinity;
    patches.forEach(p => {
      const idx = p.trial_index ?? 0;
      if(idx < minTrialIndex) minTrialIndex = idx;
    });
    if(minTrialIndex === Infinity) minTrialIndex = 0;

    data.forEach((patch, patchIndex)=>{


      if(patch.trial_type !== "foraging-patch"){
        return;
      }
      const trialIndex = (patch.trial_index ?? 0) - minTrialIndex;
      const trialTime = patch.time_in_trial != null ? patch.time_in_trial / 1000 : null;
      const condition = patch.condition ?? "";
      const patchStart = patch.patch_start_time ?? 0;

      const selections = patch.selections || [];
      
      const surroundingData = getSurroundingTrialData(
                                data,
                                patchIndex,
                                trialRange,
                                trialKeys
                                );

      selections.forEach((sel, selIndex) => {
        const pos = sel.selection_position || [null,null];

        const selTime = sel.selection_time != null 
          ? (sel.selection_time - patchStart) / 1000 
          : null;

        let role, type, supplementaryImage = null;
        if(legacyMode){
          role = sel.type ?? "";
          type = sel.image ? sel.image.replace(/^.*[\\/]/,"") : "";
        } else {
          role = sel.role ?? "";
          type = sel.type ?? "";
          supplementaryImage = sel.image ? sel.image.replace(/^.*[\\/]/,"") : "";
        }

        let row = {
          M_Participant_ID: participantID,
          M_Condition_Name: condition,
          M_Trial_Index: trialIndex,
          M_Trial_Time_in_Patch: trialTime,
          M_Selection_Index: selIndex,
          M_Selection_Role: role,
          M_Selection_Type: type,
          M_Selection_X: pos[0],
          M_Selection_Y: pos[1],
          M_Selection_Time: selTime,
          M_Selection_Value: sel.points ?? 1
        };
        if (gather) {
         Object.assign(
         row,
         surroundingData
        );
        }


        if(!legacyMode){
          row.S_Selection_Image = supplementaryImage;
        }

        rows.push(row);
      });

    });
  }

  if(rows.length===0){
    alert("No valid data found.");
    return;
  }

  if(addComputablesFlag){
    rows = addComputables(rows);
  }

  // const headers = Object.keys(rows[0]);
  // const csv = [
  //  headers.join(","),
  //  ...rows.map(r => headers.map(h => JSON.stringify(r[h] ?? "")).join(","))
  //].join("\n");
  
  
  const csv = objectArrayToCSV(rows);
  const surveyCSV = objectArrayToCSV(surveyRows);

  downloadCSV(csv);
 
  if(surveyRows.some(row => Object.keys(row).length > 1)){
    await downloadCSV(surveyCSV, "survey_data.csv");
  }
}

// -------- COMPUTABLES --------
function addComputables(rows){

  const participants = [...new Set(rows.map(r=>r.M_Participant_ID))].sort((a,b)=>a-b);
  const pMap = new Map(participants.map((p,i)=>[p,i]));

  const conditions = [...new Set(rows.map(r=>r.M_Condition_Name))].sort();
  const cMap = new Map(conditions.map((c,i)=>[c,i]));

  rows.forEach(r=>{
    r.C_Participant_Index = pMap.get(r.M_Participant_ID);
    r.C_Condition_Index = cMap.get(r.M_Condition_Name);
  });

  const trials = {};
  rows.forEach(r=>{
    const key = `${r.M_Participant_ID}_${r.M_Trial_Index}`;
    if(!trials[key]) trials[key] = [];
    trials[key].push(r);
  });

  Object.values(trials).forEach(trialRows => {

    trialRows.sort((a,b)=>a.M_Selection_Index - b.M_Selection_Index);

    let targetCount = 0;
    let lastTargetTime = null;
    let lastTargetType = null;

    trialRows.forEach(r=>{

      const isTarget = r.M_Selection_Role === "target";

      if(isTarget){
        targetCount++;
        r.C_Selection_Target_Count = targetCount;

        if(lastTargetTime === null){
          r.C_Selection_Inter_target_Time = NaN;
          r.C_Selection_Rate_of_Return =
            (r.M_Selection_Time > 0)
            ? r.M_Selection_Value / r.M_Selection_Time
            : NaN;
        } else {
          const dt = r.M_Selection_Time - lastTargetTime;
          r.C_Selection_Inter_target_Time = dt;
          r.C_Selection_Rate_of_Return =
            (dt > 0) ? r.M_Selection_Value / dt : NaN;
        }

        if(lastTargetType === null){
          r.C_Selection_Target_Switch = 0;
        } else {
          r.C_Selection_Target_Switch =
            (r.M_Selection_Type !== lastTargetType) ? 1 : 0;
        }

        lastTargetTime = r.M_Selection_Time;
        lastTargetType = r.M_Selection_Type;

      } else {
        r.C_Selection_Target_Count = targetCount;
        r.C_Selection_Inter_target_Time = NaN;
        r.C_Selection_Rate_of_Return = NaN;
        r.C_Selection_Target_Switch = 0;
      }

    });

    const maxTargets = targetCount;

    trialRows.forEach(r=>{
      r.C_Trial_Target_Count = maxTargets;
      r.C_Selection_Nth_Last_Target =
        (r.C_Selection_Target_Count > 0)
        ? (maxTargets - r.C_Selection_Target_Count + 1)
        : NaN;
    });

  });

  return rows;
}

// -------- PARSER --------
function parseJSONFlexible(text){
  try {
    const json = JSON.parse(text);
    return Array.isArray(json) ? json : [json];
  } catch {
    return text.split(/\r?\n/)
      .filter(l => l.trim())
      .map(l => { try{return JSON.parse(l)}catch{return null} })
      .filter(x=>x);
  }
}

function objectArrayToCSV(rows){

    if(rows.length===0) return "";

    const headers = [];

    rows.forEach(r=>{

        Object.keys(r).forEach(k=>{

            if(!headers.includes(k))
                headers.push(k);

        });

    });

    return [
        headers.join(","),
        ...rows.map(r=>

            headers
            .map(h=>JSON.stringify(r[h] ?? ""))
            .join(",")

        )
    ].join("\n");

}

async function downloadCSV(content, filename="output.csv"){

  // ---- try modern save dialog ----
  if (typeof window.showSaveFilePicker === "function") {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{
          description: "CSV file",
          accept: { "text/csv": [".csv"] }
        }]
      });

      const writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();

      return; // ✅ success → stop here

    } catch (err) {
      // ❗ DO NOT alert here — just fallback silently
      console.warn("Modern save failed, falling back:", err);
    }
  }

  // ---- fallback (works everywhere) ----
  try {
    const blob = new Blob([content], {type:"text/csv"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.style.display = "none";

    document.body.appendChild(a);
    a.click();

    // cleanup
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 100);

  } catch (err) {
    console.error(err);
    alert("Saving failed in this browser.");
  }
}
</script>

</body>
</html>
